# =====================================================================
# gradle.properties
# Opciones generales para Gradle.
# =====================================================================

# Memoria máxima que puede usar Gradle al compilar (2 GB)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Usa las librerías modernas de AndroidX (obligatorio hoy en día)
android.useAndroidX=true
# Estilo de código oficial de Kotlin
kotlin.code.style=official
# Cada módulo solo ve sus propios recursos (compila más rápido)
android.nonTransitiveRClass=true
